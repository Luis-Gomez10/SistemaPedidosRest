<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .ticket { background: white; padding: 20px; border-radius: 8px; width: 300px; margin: auto; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #33; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        .total { font-weight: bold; text-align: right; margin-top: 15px; }
    </style>
</head>
<body>
    <div class='ticket'>
        <h2>RESTAURANTE</h2>
        <p><b>Cliente:</b> Publico General</p>
        <p><b>Fecha:</b> 2026-11-12</p>
        <table>
            <tr><th>Platillo</th><th>Cant</th><th>Sub</th></tr>
            <tr><td>Plato Típico</td><td>2</td><td>$10.00</td></tr>
            <tr><td>Bebida Natural</td><td>2</td><td>$3.00</td></tr>
        </table>
        <p class='total'>TOTAL: $13.00</p>
        <p style='text-align:center; font-size:12px; color:#777;'>¡Gracias por su compra!</p>
    </div>
</body>
</html>
